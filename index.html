<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniFood</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Rubik:ital,wght@0,300..900;1,300..900&family=TikTok+Sans:opsz,wght@12..36,300..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="CSS/style.css" />
  </head>
  <body>
    <!-- <div class="nav">
      <nav><img src="logos/" /></nav>
    </div> -->
    <section class="hero-sec">
      <div class="hero">
        <div class="hero1">
          <h1 class="hero-title">
            A healthy meal delivered to your door, every single day
          </h1>
          <p class="hero-desc">
            The smart 365-days-per-year food subscription that will make you eat
            healthy again. Tailored to your personal tastes and nutritional
            needs.
          </p>
          <a href="#" class="btn btn-more margin-right">Start Eating Well</a>
          <a href="#" class="btn btn-less">Learn more &darr;</a>
          <div class="delivered-meals">
            <div class="delivered-images">
              <img src="img/customers/customer-1.jpg" alt="customer-img" />
              <img src="img/customers/customer-2.jpg" alt="customer-img" />
              <img src="img/customers/customer-3.jpg" alt="customer-img" />
              <img src="img/customers/customer-4.jpg" alt="customer-img" />
              <img src="img/customers/customer-5.jpg" alt="customer-img" />
              <img src="img/customers/customer-6.jpg" alt="customer-img" />
            </div>
            <p class="delivered-text">
              We have <span>delivered 250,000+ meals</span> last year!
            </p>
          </div>
        </div>
        <div class="hero2">
          <img
            class="heroimg"
            src="img/hero.png"
            alt="eating food, meals in storage, food bowls on table"
          />
        </div>
      </div>
    </section>
  </body>
</html>
